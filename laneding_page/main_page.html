<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://kit.fontawesome.com/25bba1eec4.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <link rel="stylesheet" href="./css/style.css" />
    <title>Landing Page</title>
  </head>
  <body>
    <!-- Sidebar -->
    <aside class="sidebar">
      <!-- Hamburger nằm trong sidebar -->
      <button id="sbToggle" class="sb-toggle mt-1" aria-label="Mở/đóng sidebar">
        <i class="fa-solid fa-bars"></i>
        <span class="sb-label fw-semibold">Thu gọn / Mở rộng</span>
      </button>

      <ul class="sb-menu mt-1">
        <li>
          <a class="sb-link active" href="#"
            ><i class="sb-icon fa-solid fa-home"></i
            ><span class="sb-label">Home</span></a
          >
        </li>
        <li>
          <a class="sb-link" href="#"
            ><i class="sb-icon fa-solid fa-user-graduate"></i
            ><span class="sb-label">Quản lý học sinh</span></a
          >
        </li>
        <li>
          <a class="sb-link" href="#"
            ><i class="sb-icon fa-solid fa-calendar-days"></i
            ><span class="sb-label">Thời khóa biểu</span></a
          >
        </li>
        <li>
          <a class="sb-link" href="#"
            ><i class="sb-icon fa-solid fa-gear"></i
            ><span class="sb-label">Cài đặt</span></a
          >
        </li>
      </ul>
    </aside>

    <!-- ===== CONTENT ===== -->
    <header class="topbar">
      <div class="brand-wrap">
        <!-- thay bằng hình logo thật của bạn -->
        <img
          src="./img/VTI_logo.png"
          alt="VTI Academy Logo"
          width="20%"
          height="20%"
        />
        <h1 class="greet">Quản lý học sinh</h1>
      </div>

      <div class="ms-auto d-flex align-items-center gap-3">
        <!-- Chuông thông báo -->
        <button class="icon-btn" title="Thông báo">
          <i class="fa-regular fa-bell"></i>
        </button>

        <!-- Avatar -->
        <img class="avatar" src="https://i.pravatar.cc/80?img=12" alt="user" />
      </div>

      <!-- Logout/Login -->
      <button class="icon-btn" title="Logout">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </header>

    <main class="page">
      <div class="card">
        <div class="card-header">
          <div class="d-flex justify-content-between align-items-center">
            <h5 class="card-title">Danh sách học sinh</h5>
            <div>
              <button class="btn btn-primary" onclick="fillData()">
                Bấm để lấy dữ liệu
              </button>
              <button
                class="btn btn-success"
                data-bs-toggle="modal"
                data-bs-target="#exampleModal"
              >
                + Thêm dữ liệu
              </button>
            </div>
          </div>
        </div>
        <div class="card-body">
          <table class="table">
            <thead>
              <tr class="bg-dark text-light">
                <th scope="col">STT</th>
                <th scope="col">Avatar</th>
                <th scope="col">Họ và tên</th>
                <th scope="col">Email</th>
                <th scope="col">SĐT</th>
                <th scope="col">Ngày sinh</th>
                <th scope="col">Hành động</th>
              </tr>
            </thead>
            <tbody id="data-table">
              <tr>
                <!-- <th scope="row">1</th>
          <td>10:30</td>
          <td>Duowng</td>
          <td>
            <img
              src="https://i.pinimg.com/736x/8a/81/08/8a8108bfd8036296de3baaf921969134.jpg"
              alt="//"
              width="10%"
            />
          </td>
          <td>Dong Anh</td>
          <td>25/12/2000</td> -->
              </tr>
            </tbody>
          </table>
          <hr />
        </div>
      </div>
    </main>

    <!-- JavaScript Bundle with Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="./js/function.js"></script>
  </body>
</html>
